# Core 1 lab -- n8n queue mode (main + Redis + 2 workers)
#
# Why a separate compose file: level4-docker/ is the verified Level-4 gate proof
# (3/3 backup->restore cycles). That must stay untouched -- this is a separate lab,
# separate volume, separate port. Do not run both at the same time.
#
# WARNING: N8N_ENCRYPTION_KEY must be identical on main and worker,
#          otherwise the worker cannot decrypt credentials.

x-n8n-common: &n8n-common
  image: docker.n8n.io/n8nio/n8n:latest
  environment: &n8n-env
    - DB_TYPE=postgresdb
    - DB_POSTGRESDB_HOST=postgres
    - DB_POSTGRESDB_PORT=5432
    - DB_POSTGRESDB_DATABASE=n8n
    - DB_POSTGRESDB_USER=n8n
    - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
    - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
    - EXECUTIONS_MODE=queue
    - QUEUE_BULL_REDIS_HOST=redis
    - QUEUE_BULL_REDIS_PORT=6379
    - QUEUE_HEALTH_CHECK_ACTIVE=true
    - GENERIC_TIMEZONE=Asia/Dhaka
    - N8N_RUNNERS_ENABLED=true
    - N8N_LOG_LEVEL=debug          # lab setting -- needed to observe worker/stall behavior
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: n8n
    ports:
      - "5433:5432"               # for inspecting via psql/DBeaver from the host
    volumes:
      - lab_postgres_data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro   # auto-creates the ops database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # -- main: handles UI + trigger/webhook, pushes work onto the queue --------
  n8n-main:
    <<: *n8n-common
    restart: always
    ports:
      - "5679:5678"               # avoid clashing with level4-docker (5678)
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - EXECUTIONS_MODE=queue
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PORT=6379
      - GENERIC_TIMEZONE=Asia/Dhaka
      - N8N_RUNNERS_ENABLED=true
      - N8N_LOG_LEVEL=debug
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_SECURE_COOKIE=false
      - WEBHOOK_URL=http://localhost:5679/
    volumes:
      - lab_n8n_data:/home/node/.n8n

  # -- worker: this is where actual execution happens. This is what we kill --
  n8n-worker:
    <<: *n8n-common
    restart: "no"                 # WARNING: intentional in this lab -- must not self-heal after a kill
    command: worker
    deploy:
      replicas: 2

volumes:
  lab_postgres_data:
  lab_n8n_data:
